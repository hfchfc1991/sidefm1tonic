name: Build FM-1 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Install JieLi Toolchain
        run: |
          mkdir -p jieli-tools
          cd jieli-tools
          wget -q https://pkgman.jieliapp.com/s/linux-toolchain -O jieli-toolchain.tar.xz
          tar -xf jieli-toolchain.tar.xz
          echo "$PWD/jieli-linux-toolchains-20260730.1/pi32v2/bin" >> $GITHUB_PATH

      - name: Compile Tonic Firmware
        run: |
          mkdir -p build
          # Compiles the DSP engine and display logic
          clang -target pi32v2 -O2 -c src/po32_synth.c -o build/po32_synth.o
          clang -target pi32v2 -O2 -c src/gui_sequencer.c -o build/gui_sequencer.o
          
          # Links into raw application binary
          ld.lld build/po32_synth.o build/gui_sequencer.o -o build/app.elf
          llvm-objcopy -O binary build/app.elf build/app.bin

      - name: Pack .fwsc Binary
        run: |
          chmod +x tools/isd_download || true
          # Packages bootloader, sound configs and app into .fwsc
          ./tools/isd_download -f build/app.bin \
            -toname FM-1_TONIC.fwsc \
            -dev br28 \
            -boot uboot.boot \
            -cfg cfg_tool.bin \
            -eq eq_cfg_hw.bin

      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: FM-1_TONIC_Firmware
          path: FM-1_TONIC.fwsc
